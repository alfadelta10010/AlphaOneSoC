# riscv-dv regression list for FyraCore (RV32IMACU_Zicsr_Zicntr_Zifencei).
#
# Every entry here is a test FyraCore can actually execute. Two of riscv-dv's
# stock tests are deliberately absent:
#
#   riscv_ebreak_debug_mode_test  - FyraCore has no debug mode (dcsr/dpc/dscratch
#                                   are not implemented and support_debug_mode=0
#                                   in riscv_core_setting.py), so the test would
#                                   generate dret and debug-ROM code that traps.
#
#   riscv_unaligned_load_store_test - the core raises load/store-address-misaligned
#                                   (causes 4/6) rather than completing the access,
#                                   which is why support_unaligned_load_store=0.
#                                   The test exists to force unaligned accesses
#                                   through, so it contradicts the target.
#
# riscv_csr_test is left at 0 iterations: it needs a separately generated CSR
# description file, not just the instruction generator.

- import: <riscv_dv_root>/yaml/base_testlist.yaml


# =========================================================================
# STATUS 2026-09-07: 12 of 13 streams generate, following the pyflow patches
# in the plugin's patches/ directory. riscv_pmp_test remains disabled because
# pyflow implements none of the --pmp_* options (argparse rejects them), which
# is a missing feature rather than a defect.
#
# Historical note (2026-09-06): before those patches only
# riscv_arithmetic_basic_test generated.
#
# Every other stream dies inside PyVSC with
#     vsc.model.solve_failure.SolveFailure: solve failure
# raised from vsc/model/randomizer.py:213 during constraint randomization.
# This is upstream pyflow against the installed pyvsc, not a FyraCore
# configuration problem: it persists with num_of_sub_program=0, so it is not
# the callstack path that patches 01/03 address.
#
# riscv_pmp_test fails differently -- pyflow does not implement the --pmp_*
# options at all ("unrecognized arguments"), so PMP stimulus is simply not
# available from this generator regardless of the solver issue.
#
# The iterations below are therefore set to 0 to keep the regression clean.
# They are left in place, with their full gen_test/gen_opts intact, so that
# re-enabling is a one-token change once the solver failure is resolved.
# =========================================================================

# ---- base instruction streams -------------------------------------------
# NOTE: every override below must repeat gen_test and gen_opts from
# base_testlist.yaml. run.py replaces the imported entry with this one rather
# than merging, so an entry carrying only `test` and `iterations` loses those
# fields and the generator dies with KeyError: 'gen_test'.

- test: riscv_arithmetic_basic_test
  iterations: 6
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=0
    +directed_instr_0=riscv_int_numeric_corner_stream,4
    +no_fence=1 +no_data_page=1 +no_branch_jump=1 +boot_mode=m +no_csr_instr=1

# riscv_multi_page_load_store_instr_stream and riscv_mem_region_stress_test are
# not ported to pyflow -- riscv_utils.factory() aborts with "Cannot Create
# object of ...", which kills the whole test. They exist to stress data-TLB
# switching and FyraCore is SATP_MODE = BARE with no MMU, so they are dropped
# rather than ported. Same two removed from riscv_mmu_stress_test below.
# See plugins/generator_plugins/riscv_dv_plugin/patches/README.md.
- test: riscv_rand_instr_test
  iterations: 8
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,4
    +directed_instr_1=riscv_loop_instr,4
    +directed_instr_2=riscv_hazard_instr_stream,4
    +directed_instr_3=riscv_load_store_hazard_instr_stream,4
    +directed_instr_4=riscv_jal_instr,4

- test: riscv_jump_stress_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=5000 +num_of_sub_program=0 +directed_instr_1=riscv_jal_instr,20

- test: riscv_loop_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=0 +directed_instr_1=riscv_loop_instr,20

- test: riscv_rand_jump_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,8

- test: riscv_mmu_stress_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=5000 +num_of_sub_program=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,40
    +directed_instr_1=riscv_load_store_hazard_instr_stream,40

- test: riscv_no_fence_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +no_fence=1 +num_of_sub_program=0

# ---- trap path ----------------------------------------------------------
# Exercises cause 2. Weighted up: the RTL resolves illegal-instruction last in
# its exception priority chain, against Table 3.7 of the privileged spec.
- test: riscv_illegal_instr_test
  iterations: 6
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +illegal_instr_ratio=5 +num_of_sub_program=0

# Cause 3, for both EBREAK and C.EBREAK. Needs the pyflow basic-instruction
# patch (see the plugin's patches/ directory) or it dies with KeyError.
- test: riscv_ebreak_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=6000 +no_ebreak=0 +num_of_sub_program=0

# FyraCore wires MTIP, MEIP and MSIP; mtvec is hardwired direct.
- test: riscv_full_interrupt_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +enable_interrupt=1 +num_of_sub_program=0

# ---- extension-specific -------------------------------------------------
- test: riscv_non_compressed_instr_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +disable_compressed_instr=1 +num_of_sub_program=0

# HINT encodings, including the C.LUI rd=x0 case the RVC chapter defines as a
# HINT and which the decoder previously rejected as illegal.
- test: riscv_hint_instr_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +hint_instr_ratio=5 +num_of_sub_program=0

# PMP: the RTL implements 4 regions (pmpcfg0 + pmpaddr0-3) with TOR, NA4 and
# NAPOT, so granularity is 4 bytes (G=0).
- test: riscv_pmp_test
  iterations: 0
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +pmp_randomize=0 +pmp_num_regions=4 +pmp_granularity=0 +num_of_sub_program=0
    +pmp_region_0=L:0,A:TOR,X:1,W:1,R:1,ADDR:FFFFFFFF

- test: riscv_csr_test
  iterations: 0

# ---- explicitly disabled -------------------------------------------------
# These arrive via the base_testlist import above, so omitting them is not
# enough -- they have to be overridden to zero iterations.
- test: riscv_ebreak_debug_mode_test
  iterations: 0

- test: riscv_unaligned_load_store_test
  iterations: 0
