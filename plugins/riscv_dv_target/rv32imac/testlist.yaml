# riscv-dv regression list for FyraCore (RV32IMACU_Zicsr_Zicntr_Zifencei).
#
# Every entry here is a test FyraCore can actually execute. Two of riscv-dv's
# stock tests are deliberately absent:
#
#   riscv_ebreak_debug_mode_test  - FyraCore has no debug mode (dcsr/dpc/dscratch
#                                   are not implemented and support_debug_mode=0
#                                   in riscv_core_setting.py), so the test would
#                                   generate dret and debug-ROM code that traps.
#
#   riscv_unaligned_load_store_test - the core raises load/store-address-misaligned
#                                   (causes 4/6) rather than completing the access,
#                                   which is why support_unaligned_load_store=0.
#                                   The test exists to force unaligned accesses
#                                   through, so it contradicts the target.
#
# EVERY entry must pass +instr_cnt explicitly. pyflow's argparse default is 200,
# and the pyflow patch series removed the `cfg.instr_cnt = 10000` that
# riscv_rand_instr_test.randomize_cfg() used to apply (test/riscv_instr_test_lib.sv:24
# still does it). Without it, main_program_instr_cnt lands around 193, and
# insert_illegal_hint_instr()'s `int(instr_cnt * ratio / 1000)` floors to *zero*
# -- riscv_illegal_instr_test injected no illegal instructions and
# riscv_hint_instr_test no HINTs, in every program, while still reporting pass.
#
# riscv_csr_test is left at 0 iterations. It is not generated by the instruction
# generator at all: run.py hands it to scripts/gen_csr_test.py, which needs a
# YAML description of every CSR's fields, reset values and WARL legalisation to
# build a self-checking test. Writing that description for FyraCore is a
# separate piece of work -- it has to model src/csr.v exactly, or the generated
# self-check fails on a correct core.

- import: <riscv_dv_root>/yaml/base_testlist.yaml


# =========================================================================
# STATUS 2026-09-08: all 13 streams generate, with the pyflow patches in the
# plugin's patches/ directory applied.
#
# The blocker was not the generator itself. process_regression_list() appended
# both the imported base_testlist.yaml entry and the local override for the
# same test name, so every test ran twice -- once with upstream's gen_opts.
# The upstream copy ran first, with +num_of_sub_program=5 and directed streams
# pyflow had never ported, and consumed the entire 1200s generation budget, so
# run.py was killed before the local entry started. Every stream produced zero
# assembly. Patch 11 fixes it; see patches/README.md for that and the rest.
#
# Iteration counts are weighted toward the streams most likely to find
# something: riscv_rand_instr_test at 8 for breadth, riscv_illegal_instr_test
# at 6 because the RTL resolves illegal-instruction last in its exception
# priority chain against Table 3.7 of the privileged spec.
# =========================================================================

# ---- base instruction streams -------------------------------------------
# NOTE: every override below must repeat gen_test and gen_opts from
# base_testlist.yaml. run.py replaces the imported entry with this one rather
# than merging, so an entry carrying only `test` and `iterations` loses those
# fields and the generator dies with KeyError: 'gen_test'.

- test: riscv_arithmetic_basic_test
  iterations: 6
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=0
    +directed_instr_0=riscv_int_numeric_corner_stream,4
    +no_fence=1 +no_data_page=1 +no_branch_jump=1 +boot_mode=m +no_csr_instr=1

- test: riscv_rand_instr_test
  iterations: 8
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,4
    +directed_instr_1=riscv_loop_instr,4
    +directed_instr_2=riscv_hazard_instr_stream,4
    +directed_instr_3=riscv_load_store_hazard_instr_stream,4
    +directed_instr_4=riscv_jal_instr,4

- test: riscv_jump_stress_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=5000 +num_of_sub_program=0 +directed_instr_1=riscv_jal_instr,20

- test: riscv_loop_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=0 +directed_instr_1=riscv_loop_instr,20

- test: riscv_rand_jump_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,8

# FyraCore is SATP_MODE = BARE with no MMU, so the "TLB switch" framing of this
# test does not apply, but the stimulus does: interleaved load/store streams
# each driven from their own base register, and repeated access to different
# offsets of one region. Both directed streams are pyflow ports (patch 16).
- test: riscv_mmu_stress_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=5000 +num_of_sub_program=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,40
    +directed_instr_1=riscv_load_store_hazard_instr_stream,40
    +directed_instr_2=riscv_multi_page_load_store_instr_stream,10
    +directed_instr_3=riscv_mem_region_stress_test,10

- test: riscv_no_fence_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +no_fence=1 +num_of_sub_program=0

# ---- trap path ----------------------------------------------------------
# Exercises cause 2. Weighted up: the RTL resolves illegal-instruction last in
# its exception priority chain, against Table 3.7 of the privileged spec.
- test: riscv_illegal_instr_test
  iterations: 6
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +illegal_instr_ratio=5 +num_of_sub_program=0

# Cause 3, for both EBREAK and C.EBREAK. Needs the pyflow basic-instruction
# patch (see the plugin's patches/ directory) or it dies with KeyError.
- test: riscv_ebreak_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=6000 +no_ebreak=0 +num_of_sub_program=0

# FyraCore wires MTIP, MEIP and MSIP; mtvec is hardwired direct.
- test: riscv_full_interrupt_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +enable_interrupt=1 +num_of_sub_program=0

# ---- extension-specific -------------------------------------------------
- test: riscv_non_compressed_instr_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +disable_compressed_instr=1 +num_of_sub_program=0

# HINT encodings, including the C.LUI rd=x0 case the RVC chapter defines as a
# HINT and which the decoder previously rejected as illegal.
- test: riscv_hint_instr_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +hint_instr_ratio=5 +num_of_sub_program=0

# PMP: the RTL implements 4 regions (pmpcfg0 + pmpaddr0-3) with TOR, NA4 and
# NAPOT, so granularity is 4 bytes (G=0).
#
# Region 0 is TOR up to the top of the address space with RWX and no lock, so
# nothing is denied and the program runs to completion; what is under test is
# that the core accepts the pmpcfg/pmpaddr writes and legalises them the way
# the reference model does. +enable_write_pmp_csr=1 adds the directed
# pmp_csr_write_test section, which csrrw's a random value into every pmpaddr
# and pmpcfg and then restores it -- the old value lands in a GPR each time, so
# a WARL difference between the DUT and Spike shows up in the trace instead of
# being absorbed silently.
- test: riscv_pmp_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +pmp_randomize=0 +pmp_num_regions=4 +pmp_granularity=0
    +num_of_sub_program=0
    +enable_write_pmp_csr=1
    +pmp_region_0=L:0,A:TOR,X:1,W:1,R:1,ADDR:FFFFFFFF

- test: riscv_csr_test
  iterations: 0

# ---- explicitly disabled -------------------------------------------------
# These arrive via the base_testlist import above, so omitting them is not
# enough -- they have to be overridden to zero iterations.
- test: riscv_ebreak_debug_mode_test
  iterations: 0

- test: riscv_unaligned_load_store_test
  iterations: 0
