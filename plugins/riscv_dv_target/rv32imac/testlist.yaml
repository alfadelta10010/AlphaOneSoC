# riscv-dv regression list for FyraCore (RV32IMACU_Zicsr_Zicntr_Zifencei).
#
# Generated with the pyflow-fixes branch of alfadelta10010/riscv-dv-patched,
# pinned in plugins/river-config.ini. Entries follow upstream riscv-dv's own
# testlists (yaml/base_testlist.yaml, target/*/testlist.yaml) unless a comment
# says otherwise, so a test here means what it means upstream.
#
# Options every entry carries, and why:
#
#   +instr_cnt / +num_of_sub_program
#       Always explicit. pyflow takes both from the command line (argparse
#       default 200 instructions). The SV riscv_rand_instr_test forces 10000
#       and 5 in randomize_cfg(), overriding the testlist, so entries using
#       that gen_test pass exactly those values.
#
#   +pmp_num_regions=4 +pmp_granularity=0
#       The RTL implements 4 PMP regions (pmpcfg0, pmpaddr0-3) with a 4-byte
#       grain. Upstream's default is a single region, TOR [0, main), and the
#       boot mode is random (M:U = 6:4 on an M+U core) for every test that
#       does not pass +boot_mode -- so without this a U-mode program cannot
#       fetch main. ibex passes its core's region count to every test the same
#       way.
#
# Not run:
#
#   riscv_csr_test                - generated by scripts/gen_csr_test.py from a
#                                   YAML model of every CSR's fields, reset
#                                   values and WARL legalisation. That model
#                                   has to match src/csr.v exactly and does not
#                                   exist yet.
#   riscv_ebreak_debug_mode_test  - FyraCore has no debug mode (support_debug_mode=0).
#   riscv_unaligned_load_store_test - the core raises address-misaligned
#                                   exceptions rather than completing the access
#                                   (support_unaligned_load_store=0).

- import: <riscv_dv_root>/yaml/base_testlist.yaml

# NOTE: every override below must repeat gen_test and gen_opts. run.py
# replaces the imported entry with this one rather than merging.

# ---- base instruction streams -------------------------------------------

- test: riscv_arithmetic_basic_test
  iterations: 6
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=0
    +directed_instr_0=riscv_int_numeric_corner_stream,4
    +no_fence=1 +no_data_page=1 +no_branch_jump=1 +boot_mode=m +no_csr_instr=1
    +pmp_num_regions=4 +pmp_granularity=0

- test: riscv_rand_instr_test
  iterations: 8
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5
    +directed_instr_0=riscv_load_store_rand_instr_stream,4
    +directed_instr_1=riscv_loop_instr,4
    +directed_instr_2=riscv_hazard_instr_stream,4
    +directed_instr_3=riscv_load_store_hazard_instr_stream,4
    +directed_instr_4=riscv_multi_page_load_store_instr_stream,4
    +directed_instr_5=riscv_mem_region_stress_test,4
    +directed_instr_6=riscv_jal_instr,4
    +pmp_num_regions=4 +pmp_granularity=0

- test: riscv_jump_stress_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=5000 +num_of_sub_program=5 +directed_instr_1=riscv_jal_instr,20
    +pmp_num_regions=4 +pmp_granularity=0

- test: riscv_loop_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5 +directed_instr_1=riscv_loop_instr,20
    +pmp_num_regions=4 +pmp_granularity=0

- test: riscv_rand_jump_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=10
    +directed_instr_0=riscv_load_store_rand_instr_stream,8
    +pmp_num_regions=4 +pmp_granularity=0

# FyraCore is SATP_MODE = BARE, so the "TLB" framing does not apply, but the
# stimulus does: interleaved load/store streams on their own base registers
# and repeated access to different offsets of one region.
- test: riscv_mmu_stress_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=5000 +num_of_sub_program=5
    +directed_instr_0=riscv_load_store_rand_instr_stream,40
    +directed_instr_1=riscv_load_store_hazard_instr_stream,40
    +directed_instr_2=riscv_multi_page_load_store_instr_stream,10
    +directed_instr_3=riscv_mem_region_stress_test,10
    +pmp_num_regions=4 +pmp_granularity=0

- test: riscv_no_fence_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5 +no_fence=1
    +pmp_num_regions=4 +pmp_granularity=0

# Upstream target/rv32imc_sv32 testlist. Pins U-mode; every other test here
# reaches U-mode only through the random boot mode.
- test: riscv_u_mode_rand_test
  iterations: 2
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5 +boot_mode=u
    +pmp_num_regions=4 +pmp_granularity=0

# ---- trap path ----------------------------------------------------------

# Injects encodings drawn from the SV riscv_illegal_instr model; each must trap
# with mcause 2 and be skipped by the handler.
- test: riscv_illegal_instr_test
  iterations: 6
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5 +illegal_instr_ratio=5
    +pmp_num_regions=4 +pmp_granularity=0

# Cause 3, for both EBREAK and C.EBREAK. (Upstream lists +instr_cnt=6000, which
# the SV test class overrides with 10000.)
- test: riscv_ebreak_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5 +no_ebreak=0
    +pmp_num_regions=4 +pmp_granularity=0

# Sets mstatus.MIE and mie.MEIE/MSIE. Nothing in this flow raises an
# interrupt: upstream drives them from the testbench after the signature
# handshake (+require_signature_addr), which neither the testbench nor the
# reference model here implements. Until then this is a random-instruction
# test run with interrupts enabled.
- test: riscv_full_interrupt_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5 +enable_interrupt=1
    +pmp_num_regions=4 +pmp_granularity=0

# ---- extension-specific -------------------------------------------------

- test: riscv_non_compressed_instr_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5 +disable_compressed_instr=1
    +pmp_num_regions=4 +pmp_granularity=0

# Injects HINT encodings; each must retire without changing any register.
- test: riscv_hint_instr_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5 +hint_instr_ratio=5
    +pmp_num_regions=4 +pmp_granularity=0

# Upstream target/rv64gcv testlist: LR/SC and AMO streams.
- test: riscv_amo_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5
    +directed_instr_0=riscv_lr_sc_instr_stream,10
    +directed_instr_1=riscv_amo_instr_stream,10
    +pmp_num_regions=4 +pmp_granularity=0

# ---- PMP ----------------------------------------------------------------

# Upstream target/rv32imc testlist, with this core's region count. Region 0
# covers the whole address space with RWX and no lock, so nothing is denied;
# what is under test is that the core accepts and legalises the pmpcfg/pmpaddr
# writes like the reference model. +enable_write_pmp_csr=1 adds
# pmp_csr_write_test, which csrrw's a random value into every pmpaddr and
# pmpcfg and restores it, so a WARL difference shows in the trace.
- test: riscv_pmp_test
  iterations: 4
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5
    +pmp_randomize=0 +pmp_num_regions=4 +pmp_granularity=0
    +enable_write_pmp_csr=1
    +pmp_region_0=L:0,A:TOR,X:1,W:1,R:1,ADDR:FFFFFFFF

# Not upstream entries; upstream's PMP knobs, chosen so the PMP exception
# routine's paths actually run. PMP permissions on unlocked entries bind only
# below M-mode, so these boot U-mode. Region 0 is TOR [0, main); region 1
# (default offset) runs from main past the end of RAM.
#
# Region 1 execute-only: every U-mode load and store faults once, the routine
# grants R / RW on the entry, and the faulting instruction is retried.
- test: riscv_pmp_load_store_fault_test
  iterations: 2
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5 +boot_mode=u
    +pmp_num_regions=4 +pmp_granularity=0
    +pmp_region_1=L:0,A:TOR,X:1,W:0,R:0
    +directed_instr_0=riscv_load_store_rand_instr_stream,20
    +directed_instr_1=riscv_load_store_hazard_instr_stream,10

# Region 1 not executable: fetching main faults, the routine grants X.
- test: riscv_pmp_exec_fault_test
  iterations: 2
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5 +boot_mode=u
    +pmp_num_regions=4 +pmp_granularity=0
    +pmp_region_1=L:0,A:TOR,X:0,W:1,R:1
    +directed_instr_0=riscv_load_store_rand_instr_stream,20

# Region 1 locked and not executable. A locked entry binds M-mode too, so the
# fetch of main faults and the routine ends the test through test_done -- the
# semantics of ibex's riscv_pmp_disable_all_regions_test. R/W stay granted:
# denying them would lock the trap handler out of its own kernel stack.
- test: riscv_pmp_locked_exec_test
  iterations: 2
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5
    +pmp_num_regions=4 +pmp_granularity=0
    +pmp_region_1=L:1,A:TOR,X:0,W:1,R:1

# ibex riscv_pmp_full_random_test without its ePMP/MPRV parts: random boot
# mode, randomized and possibly overlapping regions. On this memory map most
# drawn entries lie below RAM (upstream keeps addresses under 0x80000000 unless
# high addresses are allowed), so many U-mode seeds end at their first fetch by
# default deny; a locked high entry that denies writes over the kernel stack
# makes the trap handler re-fault forever and the run ends on the watchdog, as
# it does upstream (ibex runs this test with timeouts non-fatal).
- test: riscv_pmp_full_random_test
  iterations: 4
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000 +num_of_sub_program=5
    +pmp_randomize=1 +pmp_allow_illegal_tor=1
    +pmp_num_regions=4 +pmp_granularity=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,20
    +directed_instr_1=riscv_load_store_hazard_instr_stream,10

# ---- not run (see header) -----------------------------------------------
# These arrive via the base_testlist import above, so omitting them is not
# enough -- they have to be overridden to zero iterations.

- test: riscv_csr_test
  iterations: 0

- test: riscv_ebreak_debug_mode_test
  iterations: 0

- test: riscv_unaligned_load_store_test
  iterations: 0
