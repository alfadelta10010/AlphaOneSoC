float-rounding:
  rne: 10
  rtz: 10
  rdn: 10
  rup: 10
  rmm: 10

branch-control:
  backward-probability: 0.5
  block-size: 7

# ---------------------------------------------------------------------------------
# Recursion options
# Options:
#       recursion_enable:   Generate the template for recursion or not
#       recursion_depth:    Number of times the recursive function is called
# ---------------------------------------------------------------------------------
recursion-options:
  # Deeper call/return chains -- more branch and load/store pressure.
  recursion-enable: true
  recursion-depth: 10
  recursion-calls: 5

# ---------------------------------------------------------------------------------
# Data access sections
# Specify which regions of memory will be accessed by the random program
# Options:
#       enable:         Force all memory accesses instructions to only load/store
#                       to the specified list of address sections
#                       
# Section Template: Specify legal access zones using the following template
#       section_name:  section_low,section_high (HEX)     
# ---------------------------------------------------------------------------------
access-sections:
  begin_signature: 0x80091000,0x80095000,rw


# ---------------------------------------------------------------------------------
# CSR sections
# Specify which CSRs will be accessed by the random program
# Options:              
#       sections:
#                 start-value1:end-value1, value2, start-value3:end-value3 (HEX)
#                 (Any Combination)
# ---------------------------------------------------------------------------------
csr-sections:
  # Only CSRs FyraCore implements. Anything outside these ranges raises
  # illegal-instruction, which is covered deliberately via ecause02 instead
  # of accidentally through every random CSR access.
  #   0x300-0x306  mstatus, misa, mie, mtvec, mcounteren
  #   0x320        mcountinhibit
  #   0x340-0x344  mscratch, mepc, mcause, mtval, mip
  #   0x3a0        pmpcfg0        (pmpcfg1-3 read as zero)
  #   0x3b0-0x3b3  pmpaddr0-3     (4 regions; pmpaddr4-15 read as zero)
  #   0xb00-0xb82  mcycle/minstret and their high halves
  #   0xc00-0xc82  cycle/time/instret U-mode aliases (mcounteren-gated)
  #   0xf11-0xf15  mvendorid, marchid, mimpid, mhartid, mconfigptr
  sections: 0x300:0x306, 0x320, 0x340:0x344, 0x3a0, 0x3b0:0x3b3, 0xb00:0xb82, 0xc00:0xc82, 0xf11:0xf15


# ---------------------------------------------------------------------------------
# User template sections
# Allows users to specify call to a custom function with number of times to call
# User should ensure that function does not modify 
#                       
# Section Template: Specify user template function calls with the number of times
#       function_name: '{number_of_times:"function_body"}'
# ---------------------------------------------------------------------------------
user-functions:
  func1: '{0:"add x0,x0,x0"}'

# ---------------------------------------------------------------------------------
# Switching Privledge modes in rrag
#       switching_modes:  true/false (Do not provide any user defined functions when
#                         shifting mdoes is true)
#       num_switches:     # of times privlege modes has to shift (This is randomised 
#                         and shifting may result in same mode)
# ---------------------------------------------------------------------------------
switch-priv-modes:
  # FyraCore implements M and U (misa.U=1, mstatus.MPP legal values 00/11).
  # Switching exercises U-mode execution, the ecall-from-U path and MRET,
  # none of which the directed suites cover heavily.
  switch_modes: true
  num_switches: 20


# ---------------------------------------------------------------------------------
# Instruction Cache and Data-Cache Thrashing
# ---------------------------------------------------------------------------------
i-cache:
  num_calls: 0
  num_bytes_per_block: 16
  num_blocks: 8
  num_cycles: 10

d-cache:
  num_calls: 0
  num_bytes_per_block: 16
  num_blocks: 8
  num_cycles: 10

# ---------------------------------------------------------------------------------
# Exception generation
# ---------------------------------------------------------------------------------
exception-generation:
  # Weights per synchronous exception cause. Enabled where FyraCore can
  # actually raise the cause, so the trap path gets randomised coverage:
  #   0  instruction address misaligned -- UNREACHABLE: misa.C=1 means
  #      IALIGN=16, and the RTL gates ex_inst_misalign on !misa_c.
  #   1  instruction access fault  (PMP)
  #   2  illegal instruction
  #   3  breakpoint (EBREAK / C.EBREAK)
  #   4  load address misaligned   (core traps, does not emulate)
  #   5  load access fault         (PMP)
  #   6  store address misaligned  (core traps, does not emulate)
  #   7  store access fault        (PMP)
  #   8  ecall from U-mode
  #   11 ecall from M-mode
  #   9/10   ecall from S/H  -- no S or H mode
  #   12-15  page faults      -- no MMU
  ecause00: 0
  ecause01: 5
  ecause02: 10
  ecause03: 5
  ecause04: 10
  ecause05: 5
  ecause06: 10
  ecause07: 5
  ecause08: 5
  ecause09: 0
  ecause10: 0
  ecause11: 5
  ecause12: 0
  ecause13: 0
  ecause14: 0

# ---------------------------------------------------------------------------------
# Data Hazards
# ---------------------------------------------------------------------------------
data-hazards:
  raw_prob: 0.5
  war_prob: 0.5
  waw_prob: 0.5
  num_regs_lookbehind: 3

program-macro:
  pre_program_macro: "add x0,x0,x0"
  post_program_macro: "add x0,x0,x0"
  pre_branch_macro: "add x0,x0,x0"
  post_branch_macro: "add x0,x0,x0"
  ecause00: "random"
  ecause01: "random"
  ecause02: "random"
  ecause03: "random"
  ecause04: "random"
  ecause05: "random"
  ecause06: "random"
  ecause07: "random"
  ecause08: "random"
  ecause09: "random"
  ecause10: "random"
  ecause11: "random"
  ecause12: "random"
  ecause13: "random"
  ecause14: "random"

# ---------------------------------------------------------------------------------
# Self Checking 
# If self_checking flag is enabled during the gen command, the below section is used
# Options:              
#       rate: The interval at which checksums are added to the test. 
#             If rate = 10, checksums will be added every 10 instructions
# ---------------------------------------------------------------------------------

self-checking:
  rate: 100
  test_pass_macro: "la      sp, begin_signature; addi    sp, sp, 2*REGBYTES; li  \
    \    t1, 0xfffff; SREG    t1, 0*REGBYTES(sp)"
  test_fail_macro: "add x0,x0,x0"
