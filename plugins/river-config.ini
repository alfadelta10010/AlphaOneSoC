# River Core configuration for FyraCore verification
#
# All generators share the same DUT, reference, and helper paths.
# Switch generators via: river_core generate -c river-config.ini -v debug
# then compile:          river_core compile  -c river-config.ini -t build/mywork/test_list.yaml --timeout 600 --nproc 8 -v debug
#
# To use a different generator, change the 'generator' field below.
# Available: riscv_tests, rrag, riscof, riscv_torture, testfloat

[river_core]
work_dir = ../build/mywork
target = fyracore_iverilog
reference = spike
generator = riscv_tests
isa = RV32IMACZicsr_Zifencei
path_to_target = ./
path_to_ref = ./reference_plugins
path_to_suite = ./generator_plugins
open_browser = False
space_saver = True

[coverage]
code = False
functional = False

# ---------------------------------------------------------------
#  DUT Plugin — FyraCore on Icarus Verilog
# ---------------------------------------------------------------
[fyracore_iverilog]
jobs = 8
count = 1
filter =
src_dir = ../
isa = RV32IMACZicsr_Zifencei
stop_on_failure = False

# ---------------------------------------------------------------
#  Reference Plugin — Spike ISA simulator
# ---------------------------------------------------------------
[spike]
jobs = 8
filter =
count = 1
pmp_regions = 8
pmp_granularity = 4
tcm = false
mem = false
mem_flags =
dtb =
resetpc = 0x80000000
isa = RV32IMACZicsr_Zifencei

# ---------------------------------------------------------------
#  Generator: riscv-tests (standard RISC-V ISA test suite)
# ---------------------------------------------------------------
[riscv_tests]
seed =
count =
jobs = 1
filter =
pmp_regions = 8
helper_files_path = /home/alfadelta10010/projects/AlphaOneSoC/plugins/helpers

# ---------------------------------------------------------------
#  Generator: RRAG (random RISC-V assembly generator)
# ---------------------------------------------------------------
[rrag]
jobs = 8
filter =
seed = random
count = 4
work_dir = ../build/mywork/
gen_type = config
config_dir = ./rrag_configs/
helper_files_path = ./helpers

# ---------------------------------------------------------------
#  Generator: RISCOF (official RISC-V compliance tests)
# ---------------------------------------------------------------
[riscof]
jobs = 8
filter =
helper_files_path = ./helpers

# ---------------------------------------------------------------
#  Generator: riscv-torture (random instruction torture tests)
# ---------------------------------------------------------------
[riscv_torture]
jobs = 8
filter =
seed = random
count = 2
helper_files_path = ./helpers

# ---------------------------------------------------------------
#  Generator: TestFloat (floating-point tests — only if F/D ext)
# ---------------------------------------------------------------
[testfloat]
jobs = 8
filter =
seed = random
count = 1
helper_files_path = ./helpers
