# River Core configuration for FyraCore verification
#
# Run:
#   river_core generate -c river-config.ini -v debug
#   river_core compile  -c river-config.ini -t ../build/mywork/test_list.yaml --timeout 600 --nproc 8 -v debug

[river_core]
work_dir = ../build/mywork
target = fyracore_iverilog
reference = spike
generator = riscv_tests, riscof, rrag, riscv_dv
path_to_target = ./
path_to_ref = ./reference_plugins
path_to_suite = ./generator_plugins
open_browser = False
space_saver = True
isa = RV32IMACUZicsr_Zicntr_Zifencei

[coverage]
code = False
functional = False

# ---------------------------------------------------------------
#  DUT Plugin — FyraCore on Icarus Verilog
# ---------------------------------------------------------------
[fyracore_iverilog]
jobs = 8
count = 1
filter =
src_dir = ../
stop_on_failure = False
# Cycle backstop for a hung pipeline -- a stall that never clears and retires
# nothing, which an instruction bound can never catch.
#
# Which of the two bounds fires first depends on IPC: max_instr binds only
# above IPC 0.067, and a memory-heavy program runs well below that
# (riscv_loop_test_0 stopped on max_cycles at 162,309 retires, IPC 0.054).
# Either way the testbench appends a DUT-ABORT line to the dump so the test
# fails rather than comparing equal, and sim.log names the bound that fired.
max_cycles = 3000000
# Retire budget. Measured over 1200 passing tests the largest legitimate run is
# 85,111 retires (p99 = 78,012), so this is ~2.3x headroom. The spike section
# must carry the same value.
max_instr = 200000
# Hard ceiling on any file the simulation writes, in MiB (0 disables).
#
# Coupled to max_instr: a commit-log line is 47-54 bytes, so 64 MiB holds
# ~1.24M lines. That is 6x the current retire budget, but raising max_instr
# past ~1.1M would let SIGXFSZ truncate a trace before it reaches the budget,
# and a legitimate run would then fail on length. Raise both together.
max_dump_mb = 64

# ---------------------------------------------------------------
#  Reference Plugin — Spike ISA simulator
# ---------------------------------------------------------------
[spike]
jobs = 8
filter =
count = 1
pmp_regions = 4
pmp_granularity = 4
tcm = false
mem = false
# Narrow spike to exactly the window the DUT implements: 32 MB at 0x80000000.
#
# Left empty, spike uses its own default of 2048 MiB at DRAM_BASE 0x80000000
# -- the whole upper 2 GB -- while tb/memory_model.v answers *every* address.
# The two models then disagree about which addresses are mapped, which caused
# 884 of the 887 rrag failures on 2026-09-09: spike faults on a fetch below
# 0x80000000, the DUT aliases it and re-runs the image.
#
# This is one half of a coupled pair. The other half is the core's PMA check
# (src/fyracore.v PMA_MEM_BASE/PMA_MEM_TOP, driven from tb_rivercore.v's
# MEM_SIZE). Either half alone trades one divergence class for another:
# narrowing spike alone makes spike fault at 0xFFFFFFFE where the DUT does
# not; adding the PMA alone does the reverse. Change both together.
mem_flags = -m0x80000000:0x2000000
# Replace spike's auto-generated device tree with one that names only the
# devices the DUT models. Spike builds its bus from this tree, so a node that
# is absent is a device that does not exist: this deletes the PLIC at
# 0x0C000000 and the ns16550 UART at 0x10000000, both of which answer loads and
# stores on stock spike and take an access fault on the DUT. Measured on
# spike 1.1.1-dev: with this file 0x0C000000 and 0x10000000 fault on both
# models; without it spike returns data and a byte store to 0x10000000 even
# prints to the run's stdout.
#
# What it cannot change (both verified by probe, see the .dts header):
#   * the CLINT's size -- the reg size in the node is ignored and spike always
#     maps 0xC0000 from the base, which is why [fyracore_iverilog]'s testbench
#     sizes PMA_IO0 to 0x02000000-0x020BFFFF.
#   * the boot ROM at 0x1000 -- it is added after this tree is parsed and it
#     holds the reset vector, so --disable-dtb removes the reset vector too and
#     spike hangs at 0x1000 with an empty log.
# Leave empty to fall back to spike's own tree (PLIC and UART come back).
dtb = --dtb=/home/alfadelta10010/projects/AlphaOneSoC/plugins/helpers/spike-fyracore.dtb
resetpc = 0x80000000
# Hard ceiling on any file the reference run writes, in MiB (0 disables).
# Largest legitimate ref.dump in the current suite is 3.7 MB; a program that
# does not terminate under spike reaches 16 MiB in under a second.
max_dump_mb = 64
# Must match [fyracore_iverilog] max_instr. ref.dump is cut to this many
# commit-log lines (after the boot-ROM prologue is stripped), so both models
# present the same number of retired instructions.
#
# This is NOT passed to spike as --instructions. That flag counts steps, not
# retires: a trap ends the current INTERLEAVE window early and the whole 5000
# is charged anyway, so ~40 traps exhaust a 200k budget. All 12 rrag programs
# sampled (81-699 traps) stopped at ~4k lines of the 9k-75k they retire, and
# passing tests were reported as failures.
max_instr = 200000
# Runaway guard in spike *steps*, not retires. Only for a program that traps
# forever while retiring nothing -- it writes no trace, so neither the file cap
# nor max_instr can stop it. timeout and max_dump_mb cover everything else.
#
# Left empty on purpose: the plugin derives 5000 x max_instr, which is the
# worst case the mechanism allows (every retire followed by a trap). A fixed
# round number only moves the cliff -- 10,000,000 allows 1999 traps, and the
# densest rrag program measured needs ~1840 to reach max_instr. Set it here
# only to override that.
spike_step_budget =

# ---------------------------------------------------------------
#  Generator: riscv-tests (standard RISC-V ISA test suite)
# ---------------------------------------------------------------
[riscv_tests]
seed =
count =
jobs = 1
filter =
pmp_regions = 4
helper_files_path = /home/alfadelta10010/projects/AlphaOneSoC/plugins/helpers

# ---------------------------------------------------------------
#  Generator: RISCOF (riscv-arch-test compliance suite)
# ---------------------------------------------------------------
[riscof]
jobs = 1
filter =
seed =
count =
riscof_config = /home/alfadelta10010/projects/AlphaOneSoC/plugins/riscof-config-0.ini
helper_files_path = /home/alfadelta10010/projects/AlphaOneSoC/plugins/helpers
version = 3.9.1
suite =
env =

# ---------------------------------------------------------------
#  Generator: rrag (Random RISC-V Assembly Generator)
# ---------------------------------------------------------------
#  Requires the `rrag` executable on PATH. It is an InCore package and is
#  not on public PyPI — install it into the rivercore pyenv before enabling:
#      pip install <rrag wheel or private index>
#  `rrag randomise-configs` derives the per-test instruction mix from the
#  `isa` set in [river_core], so base_config.yaml ships all distributions
#  at 0 and does not need per-ISA editing.
[rrag]
jobs = 8
count = 50
filter =
seed = random
gen_type = random_config
num_configs = 20
base_config = /home/alfadelta10010/projects/AlphaOneSoC/plugins/generator_plugins/rrag_plugin/base_config.yaml
helper_files_path = /home/alfadelta10010/projects/AlphaOneSoC/plugins/helpers
tcm = False
# rrag_path is optional: rrag is invoked as a subprocess CLI, so it can live in
# a different environment than river_core. Leave unset to use `rrag` on PATH.
# rrag_path =
#
# opcodes_url is optional and only consulted when rrag has no isa_dict.py yet.
# rrag's default points at a private URL, and current upstream riscv-opcodes no
# longer parses, so point this at a local clone if the metadata needs rebuilding:
#   opcodes_url = file:///path/to/riscv-opcodes
# opcodes_url =

# ---------------------------------------------------------------
#  Generator: riscv-dv via its pyflow backend
# ---------------------------------------------------------------
#  pyflow is the Python/PyVSC generator, so no SystemVerilog simulator is
#  needed -- the stock riscv-dv flow is SV/UVM and would require VCS, Questa
#  or Xcelium, and Verilator cannot run UVM. Requires `pip install pyvsc`.
#
#  Upstream pyflow is broken in ways that make most tests generate nothing
#  or test nothing; the fixes are commits on the pyflow-fixes branch of the
#  fork below. riscv-dv is cloned on first run and then reused; it is not
#  re-cloned each time. Delete riscv_dv_dir to force a fresh checkout.
[riscv_dv]
jobs = 8
count = 1
filter =
seed =
target = rv32imac
riscv_dv_dir = /home/alfadelta10010/projects/AlphaOneSoC/build/riscv-dv
custom_target = /home/alfadelta10010/projects/AlphaOneSoC/plugins/riscv_dv_target/rv32imac
# The fork holding the pyflow fixes (branch pyflow-fixes). An existing
# checkout cloned from anywhere else is re-pointed at it.
repo = https://github.com/alfadelta10010/riscv-dv-patched.git
# The fork revision to generate from, and the one the testlist was validated
# on. Enforced on every run, not just on the first clone; tracked files in
# riscv_dv_dir are reset first. Use a full sha.
version = 256f97159dcebbdeac9be246bce042e42e0f5950
