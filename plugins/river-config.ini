# River Core configuration for FyraCore verification
#
# Run:
#   river_core generate -c river-config.ini -v debug
#   river_core compile  -c river-config.ini -t ../build/mywork/test_list.yaml --timeout 600 --nproc 8 -v debug

[river_core]
work_dir = ../build/mywork
target = fyracore_iverilog
reference = spike
generator = riscv_tests, riscof, rrag
path_to_target = ./
path_to_ref = ./reference_plugins
path_to_suite = ./generator_plugins
open_browser = False
space_saver = True
isa = RV32IMACUZicsr_Zicntr_Zifencei

[coverage]
code = False
functional = False

# ---------------------------------------------------------------
#  DUT Plugin — FyraCore on Icarus Verilog
# ---------------------------------------------------------------
[fyracore_iverilog]
jobs = 8
count = 1
filter =
src_dir = ../
stop_on_failure = False

# ---------------------------------------------------------------
#  Reference Plugin — Spike ISA simulator
# ---------------------------------------------------------------
[spike]
jobs = 8
filter =
count = 1
pmp_regions = 8
pmp_granularity = 4
tcm = false
mem = false
mem_flags =
dtb =
resetpc = 0x80000000

# ---------------------------------------------------------------
#  Generator: riscv-tests (standard RISC-V ISA test suite)
# ---------------------------------------------------------------
[riscv_tests]
seed =
count =
jobs = 1
filter =
pmp_regions = 8
helper_files_path = /home/alfadelta10010/projects/AlphaOneSoC/plugins/helpers

# ---------------------------------------------------------------
#  Generator: RISCOF (riscv-arch-test compliance suite)
# ---------------------------------------------------------------
[riscof]
jobs = 1
filter =
seed =
count =
riscof_config = /home/alfadelta10010/projects/AlphaOneSoC/plugins/riscof-config-0.ini
helper_files_path = /home/alfadelta10010/projects/AlphaOneSoC/plugins/helpers
version = 3.9.1
suite =
env =

# ---------------------------------------------------------------
#  Generator: rrag (Random RISC-V Assembly Generator)
# ---------------------------------------------------------------
#  Requires the `rrag` executable on PATH. It is an InCore package and is
#  not on public PyPI — install it into the rivercore pyenv before enabling:
#      pip install <rrag wheel or private index>
#  `rrag randomise-configs` derives the per-test instruction mix from the
#  `isa` set in [river_core], so base_config.yaml ships all distributions
#  at 0 and does not need per-ISA editing.
[rrag]
jobs = 8
count = 20
filter =
seed = random
gen_type = random_config
num_configs = 10
base_config = /home/alfadelta10010/projects/AlphaOneSoC/plugins/generator_plugins/rrag_plugin/base_config.yaml
helper_files_path = /home/alfadelta10010/projects/AlphaOneSoC/plugins/helpers
tcm = False
# rrag_path is optional: rrag is invoked as a subprocess CLI, so it can live in
# a different environment than river_core. Leave unset to use `rrag` on PATH.
# rrag_path =
