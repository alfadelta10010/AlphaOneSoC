# riscv-formal checks for fyracore (WO-37). Pin c992aa61fdfe0846c5ed90324c596202a1c69b76.
# Results are BMC: a PASS is "BOUNDED (BMC depth N from reset)", never PROVED.
# The environment (what is assumed) is in tb/rvfi/wrapper.sv.
[options]
isa rv32imc
nret 1
solver yices
# (default; step C calibration may change it. bmc3 needs run.sh's skip-strip, done there.)

[depth]
# Depth arithmetic (zero-wait): cycle 0 is reset, then fetch, then IF/EX; EX takes
# three cycles; the first retire is at cycle 5 and then about one per 3 cycles.
# Plain insn: ~6 instructions of history at CPI 3 (picorv32 uses 20).
insn            20
# Iterative units. MEASURED first retire step k by the lat_* probes (run.sh, WO-37a):
# SLLI by 31 k=38, MUL* k=39, DIV/REM k=41. Depth = k + 3 (one prior instruction).
# Shallower than k the check is vacuous (assume(spec_valid) cannot hold).
insn_(sll|srl|sra|slli|srli|srai|c_slli|c_srli|c_srai)  41
insn_(mul|mulh|mulhsu|mulhu)                            42
insn_(div|divu|rem|remu)                                44
reg        15    30
pc_fwd     10    30
pc_bwd     10    30
causal     10    30
unique     1  10 30
# liveness L = 10 + the worst retire-to-retire gap under fairness (FYRA_MAX_WAIT 1):
# interrupt (no retire) + mtvec fetch + 3 EX + DIV 36 + capture = ~52; L = 62.
liveness   1  10 62
ill             20
cover      1    20
# Optional "deep" group (WO-38, only if its budget allows): two M ops back to
# back (the 2e6718b previous-result class, mutant FC50), and a longer reg check.
#insn_(mul|div)  84
#reg        10    50

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define FYRA_MAX_WAIT 2

[defines cover]
`define FYRA_WRAPPER_COVERS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/rf_top_rvfi.v
@basedir@/cores/@core@/alu.v
@basedir@/cores/@core@/branchCtrl.v
@basedir@/cores/@core@/compressed_decoder.v
@basedir@/cores/@core@/controller.v
@basedir@/cores/@core@/csr.v
@basedir@/cores/@core@/decoder.v
@basedir@/cores/@core@/muldiv.v
@basedir@/cores/@core@/pmp.v
@basedir@/cores/@core@/regFile.v
@basedir@/cores/@core@/signExt.v
@basedir@/cores/@core@/fyracore.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
always @* if (!reset) cover (rvfi_valid && rvfi_intr && !rvfi_trap);
always @* if (!reset) cover (rvfi_valid && rvfi_insn == 32'h30200073 && !rvfi_trap);
always @* if (!reset) cover (rvfi_valid && rvfi_insn[6:0] == 7'b0101111 && rvfi_insn[31:27] != 5'b00010 && rvfi_insn[31:27] != 5'b00011 && rvfi_mem_wmask == 4'hf);
always @* if (!reset) cover (rvfi_valid && !rvfi_trap && rvfi_insn[6:0] == 7'b0101111 && rvfi_insn[31:27] == 5'b00011 && rvfi_rd_addr != 5'd0 && rvfi_rd_wdata == 32'd1);
reg cv_c = 1'b0;
reg [31:0] cv_pc = 32'b0;
always @(posedge clock) if (rvfi_valid) begin cv_c <= (rvfi_insn[1:0] != 2'b11) && !rvfi_trap; cv_pc <= rvfi_pc_rdata; end
always @* if (!reset) cover (rvfi_valid && rvfi_insn[1:0] == 2'b11 && cv_c && rvfi_pc_rdata == cv_pc + 32'd2);
always @* if (!reset) cover (rvfi_valid && rvfi_mode == 2'b11);
