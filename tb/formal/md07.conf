# WO-32: MD07 equivalence (md07_props.sv), muldiv alone; E1/I1/I2 proved by sat k-induction, length 1
MD_PRE="hierarchy -top muldiv; proc; expose w:st w:acc w:lo w:m w:isdiv w:sum w:trial;"
FILES[md07]="muldiv.v"; MODE[md07]=induct; IDEPTH[md07]=1; PRE[md07]="$MD_PRE"; NVDEPTH[md07]=48   # pdr did not close in 1200 s (WO-32 log)
ALL+=(md07)
FILES[md07_cov]="muldiv.v"; MODE[md07_cov]=cover; PROPN[md07_cov]=md07; PRE[md07_cov]="$MD_PRE"; BDEPTH[md07_cov]=${MD07COV_DEPTH:-24}
ALL+=(md07_cov)
