# WO-32: FC02 / FC49 equivalence invariants of the core (core_inv_props.sv)
# WO-32 FALLBACK 2: sat induction at length 1 does NOT close (CTIs left after S1-S4, M1: muldiv_inst's op vs the EX instruction,
# st=SH with a MUL in EX, ...), pdr not tried on the core; so a bounded check from reset, depth CI_DEPTH. FC02/FC49: equivalent (argument + bounded).
# white-box via expose
CI_PRE="hierarchy -top fyracore; proc; flatten t:muldiv; cd fyracore; rename muldiv_inst.st x_mst; expose w:x_mst w:csr_wb_hazard w:ex_ph w:ex_wait w:ifex_valid w:flush w:muldiv_want w:muldiv_ready w:muldiv_busy w:muldiv_done w:wb_busy w:wb_mem_stall w:wfi_active w:ex_ifetch_hi_phase w:ex_rf_ok w:exwb_valid w:exwb_csrWR w:exwb_trap w:exwb_memRD w:exwb_memWR w:exwb_isAmo w:muldiv_capture w:ex_is_iter; cd ..;"
FILES[core_inv]="$CORE"; EXTRA[core_inv]="rf_top_stub.v"; PASSES[core_inv]="memory_map; setundef -undriven -expose;"
MODE[core_inv]=sbmc; BDEPTH[core_inv]=${CI_DEPTH:-80}; PRE[core_inv]="$CI_PRE"; NVDEPTH[core_inv]=${CI_NVDEPTH:-40}
ALL+=(core_inv)
FILES[core_inv_cov]="$CORE"; EXTRA[core_inv_cov]="rf_top_stub.v"; PASSES[core_inv_cov]="memory_map; setundef -undriven -expose;"
MODE[core_inv_cov]=cover; PROPN[core_inv_cov]=core_inv; PRE[core_inv_cov]="$CI_PRE"; BDEPTH[core_inv_cov]=${CICOV_DEPTH:-48}
ALL+=(core_inv_cov)
# core_inv_armed_cov: the cover "after a reset, with the unit seen idle first, a MUL/DIV done"
# (FC49: an M-op done at step 38 from reset). Without `vcd off` sby dies writing the trace of
# this cover ("Writing trace to VCD file" is the last log line, no verdict); with SBYOPT
# `vcd off` it ends DONE (PASS) and gives a clean COVERED, so it is in the default list.
FILES[core_inv_armed_cov]="$CORE"; EXTRA[core_inv_armed_cov]="rf_top_stub.v"; PASSES[core_inv_armed_cov]="memory_map; setundef -undriven -expose;"
MODE[core_inv_armed_cov]=cover; PROPN[core_inv_armed_cov]=core_inv; PRE[core_inv_armed_cov]="$CI_PRE"; BDEPTH[core_inv_armed_cov]=${CIARM_DEPTH:-48}; DEFS[core_inv_armed_cov]="-DARMED_COVER"; SBYOPT[core_inv_armed_cov]="vcd off"
ALL+=(core_inv_armed_cov)
