# WO-31 part A: soc_bus ready rule and decode (bus_props.sv)
FILES[bus]="soc_bus.v plic.v uart.v gpio.v spi.v"; MODE[bus]=pdr; NVDEPTH[bus]=48
PASSES[bus]="memory_map;"
ALL+=(bus)
FILES[bus_cov]="${FILES[bus]}"; MODE[bus_cov]=cover; PROPN[bus_cov]=bus; BDEPTH[bus_cov]=64
PASSES[bus_cov]="memory_map;"
ALL+=(bus_cov)
