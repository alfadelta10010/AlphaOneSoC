# WO-62: instruction cache (src/cache.v, K4). The macro is replaced by a model in cache_props.sv (module rf_top: a real
# 32 x 32 storage, a read of the word written on the same edge answers free data), so FILES holds cache.v alone.
#   cache      EN tied 1 (-DEN1; the cache takes over in the first cycles): every completed fetch returns the bytes of a shadow memory (one tracked byte address, free
#              contents, data-port stores applied); contracts of m_* and f_ready. BOUNDED, run through sby (bitwuzla):
#              yosys's own solver does not get past depth ~16 in reasonable time.
#   cache_en   the same with EN free, a shallower bound.
#   cache_pt   EN tied 0: pass-through equality of every fetch signal and active == 0. PROVED (induction).
#   cache_cov  hit, fill, eviction, store-invalidate, straddle in a line, straddle across lines.
FILES[cache]="cache.v"; MODE[cache]=sbmc; BDEPTH[cache]=${CACHE_DEPTH:-40}; DEFS[cache]="-DEN1"
PASSES[cache]="setundef -undriven -expose;"          # the macro model stays an SMT array (memory_map makes it 1,024 flops: depth 18 took 6 minutes)
ALL+=(cache)
FILES[cache_pt]="cache.v"; MODE[cache_pt]=induct; IDEPTH[cache_pt]=2; PROPN[cache_pt]=cache; DEFS[cache_pt]="-DPT"
PASSES[cache_pt]="memory_map; setundef -undriven -expose;"
NVDEPTH[cache_pt]=12
ALL+=(cache_pt)
FILES[cache_cov]="cache.v"; MODE[cache_cov]=cover; PROPN[cache_cov]=cache; BDEPTH[cache_cov]=${CACHECOV_DEPTH:-34}
PASSES[cache_cov]="setundef -undriven -expose;"
ALL+=(cache_cov)
# The same with EN free (the takeover and hand-back, a fill running while EN falls): a shallower bound, the state
# space of the toggling is what makes the solver slow.
FILES[cache_en]="cache.v"; MODE[cache_en]=sbmc; PROPN[cache_en]=cache; BDEPTH[cache_en]=${CACHE_EN_DEPTH:-20}
PASSES[cache_en]="setundef -undriven -expose;"
ALL+=(cache_en)
