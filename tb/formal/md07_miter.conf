# WO-32: MD07 miter against the original (md07_miter_props.sv), bounded
# gen_md07_miter: $OUT/muldiv_md07.v = src/muldiv.v with the catalogue mutant MD07
# (or -DMITER_MUT=<id> from EXTRA_DEFS) applied from tb/mutate/mutants.py and the module renamed.
gen_md07_miter() {
  local mut; mut=$(echo "${EXTRA_DEFS:-}" | sed -n 's/.*-DMITER_MUT=\([A-Z0-9]*\).*/\1/p'); mut=${mut:-MD07}
  python3 - "$ROOT/tb/mutate" "$1/muldiv.v" "$2/muldiv_md07.v" "$mut" <<'PYEOF' || return 1
import sys
sys.path.insert(0, sys.argv[1])
from mutants import M
e = [x for x in M if x[0] == sys.argv[4]]
if len(e) != 1: sys.exit("no such mutant %s" % sys.argv[4])
mid, f, find, rep, why = e[0]
if f != "muldiv.v": sys.exit("%s is not a muldiv.v mutant" % mid)
t = open(sys.argv[2]).read()
if t.count(find) != 1: sys.exit("%s: find string occurs %d times" % (mid, t.count(find)))
t = t.replace(find, rep).replace("module muldiv (", "module muldiv_md07 (", 1)
open(sys.argv[3], "w").write(t)
PYEOF
  echo "$2/muldiv_md07.v"
}
FILES[md07_miter]="muldiv.v"; GEN[md07_miter]=gen_md07_miter; MODE[md07_miter]=sbmc; BDEPTH[md07_miter]=${MM_DEPTH:-40}; PDR_TIMEOUT[md07_miter]=${MM_TIMEOUT:-14400}
# md07_miter is opt-in (not in the default list), run it by name: sby bmc reached step 29 of 40 in 76 min
# (2026-11-07). MD07 itself is PROVED by md07 (k-induction, length 1); the miter is extra evidence.
FILES[md07_miter_cov]="muldiv.v"; GEN[md07_miter_cov]=gen_md07_miter; MODE[md07_miter_cov]=cover; PROPN[md07_miter_cov]=md07_miter; BDEPTH[md07_miter_cov]=${MM_DEPTH:-40}
ALL+=(md07_miter_cov)
