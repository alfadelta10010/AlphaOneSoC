# WO-54b: pin-level rules of the QSPI engine alone (src/qspi_ctrl.v, free inputs, ddr and ddr_cap free).
# Unlike the mem_* harnesses this one reads the real engine, negedge flops included, through clk2fflogic
# (sby `multiclock on`): each clock is two steps and the props file makes clk alternate and holds every
# input except io_in between rising edges. See qspi_pins_props.sv for the rules (a)-(d). No mem_ctrl
# is attached, so no request-protocol assumption is made: the rules must hold for any start / addr / we.
PASSES[qspi_pins]="techmap t:\$shiftx; setundef -anyseq;"; FILES[qspi_pins]="qspi_ctrl.v"; MODE[qspi_pins]=pdr; PDR_TIMEOUT[qspi_pins]=1200; SBYOPT[qspi_pins]="multiclock on"
ALL+=(qspi_pins)
PASSES[qspi_pins_cov]="techmap t:\$shiftx; setundef -anyseq;"; FILES[qspi_pins_cov]="qspi_ctrl.v"; MODE[qspi_pins_cov]=cover; PROPN[qspi_pins_cov]=qspi_pins; BDEPTH[qspi_pins_cov]=${PINSCOV_DEPTH:-500}; PDR_TIMEOUT[qspi_pins_cov]=3000; SBYOPT[qspi_pins_cov]=$'multiclock on\nvcd off'   # 1400 s on the loaded sandbox
ALL+=(qspi_pins_cov)
