# WO-54: timer/PWM (src/pwm.v). White-box state exposed by PRE so the transition properties see the previous-cycle
# state; every property relates one non-reset step.
FILES[pwm]="pwm.v"; MODE[pwm]=induct; IDEPTH[pwm]=1
PRE[pwm]="hierarchy -top pwm; proc; expose w:scale w:ip w:sticky w:zerocmp w:enalways w:enoneshot w:pre w:s w:cmp0 w:cmp1"
NVDEPTH[pwm]=24
ALL+=(pwm)
FILES[pwm_cov]="pwm.v"; MODE[pwm_cov]=cover; PROPN[pwm_cov]=pwm; BDEPTH[pwm_cov]=${PWMCOV_DEPTH:-40}
PRE[pwm_cov]="${PRE[pwm]}"
ALL+=(pwm_cov)
