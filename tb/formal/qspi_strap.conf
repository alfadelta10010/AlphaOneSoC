# WO-31 part C: qspi_ctrl twice, rd_late strap held (qspi_strap_props.sv)
# qspi_x.v: src/qspi_ctrl.v renamed, with sr, {t_we, t_psram} and every control flop
# {state, cnt, init, step, late, again, strm, t_top, t_sel, p} as extra outputs (WO-54a: strm, t_top, t_sel, p are the streaming flops, and x_all is 41 bits: it was 12 and dropped the top bit of state).
# WO-54b: built from the SDR copy of the engine (gen_qspi_sdr in mem.conf: negedge -> posedge, sound with
# ddr = 0, argument in mem.conf's header); x_all also carries the DDR flops that are not negedge:
# {t_ddr, t_cap, dq} (49 bits); nib_p is exported as x_nib but left out of the equality: it is not reset,
# and in an unreachable start state it takes x (out-of-range part-select, turned into a free value per copy
# by setundef -anyseq), so the copies would differ for a reason unrelated to the strap; with ddr = 0 it
# reaches nothing. The strap property is proved for SDR reads only; whether DDR
# reads ignore rd_late is not covered here.
gen_qspi_x() {
  local s; s=$(gen_qspi_sdr "$1" "$2") || return 1
  sed -e 's/^module qspi_ctrl (/module qspi_x (\n    output wire [31:0] x_sr,\n    output wire [1:0] x_tt,\n    output wire [48:0] x_all,\n    output wire [3:0] x_nib,/' \
      -e 's/^endmodule/    assign x_sr = sr; assign x_tt = {t_we, t_psram}; assign x_all = {state, cnt, init, step, late, again, strm, t_top, t_sel, p, t_ddr, t_cap, dq}; assign x_nib = nib_p;\nendmodule/' "$s" > "$2/qspi_x.v"
  echo "$2/qspi_x.v"
}
PASSES[qspi_strap]="techmap t:\$shiftx; setundef -anyseq;"; FILES[qspi_strap]="qspi_ctrl.v"; GEN[qspi_strap]=gen_qspi_x; MODE[qspi_strap]=pdr; PDR_TIMEOUT[qspi_strap]=1200
ALL+=(qspi_strap)
PASSES[qspi_strap_cov]="techmap t:\$shiftx; setundef -anyseq;"; FILES[qspi_strap_cov]="qspi_ctrl.v"; GEN[qspi_strap_cov]=gen_qspi_x; MODE[qspi_strap_cov]=cover; PROPN[qspi_strap_cov]=qspi_strap; BDEPTH[qspi_strap_cov]=${STRAPCOV_DEPTH:-300}
ALL+=(qspi_strap_cov)
