# WO-55/WO-63: audio (src/audio.v). White-box state exposed by PRE so the transition properties see the previous-cycle
# state; every property relates one non-reset step, plus one ghost invariant for the PWM frame (P3).
FILES[audio]="audio.v"; MODE[audio]=induct; IDEPTH[audio]=1
PRE[audio]="hierarchy -top audio; proc; expose w:per w:c w:oct w:en w:pre"
NVDEPTH[audio]=40
ALL+=(audio)
FILES[audio_cov]="audio.v"; MODE[audio_cov]=cover; PROPN[audio_cov]=audio; BDEPTH[audio_cov]=${AUDIOCOV_DEPTH:-40}
PRE[audio_cov]="${PRE[audio]}"
ALL+=(audio_cov)
