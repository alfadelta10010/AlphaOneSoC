# WO-53: gamepad receiver (src/gamepad.v). White-box state exposed by PRE (sh nb d chg ie latch_p) so the
# transition properties see the previous-cycle state; every property relates one non-reset step.
FILES[gamepad]="gamepad.v"; MODE[gamepad]=induct; IDEPTH[gamepad]=1
PRE[gamepad]="hierarchy -top gamepad; proc; expose w:sh w:nb w:d w:chg w:ie w:latch_p w:pclk_p"
NVDEPTH[gamepad]=64   # a load needs 12 or 24 clock edges
ALL+=(gamepad)
FILES[gamepad_cov]="gamepad.v"; MODE[gamepad_cov]=cover; PROPN[gamepad_cov]=gamepad; BDEPTH[gamepad_cov]=${GPCOV_DEPTH:-60}
PRE[gamepad_cov]="${PRE[gamepad]}"
ALL+=(gamepad_cov)
