# WO-49: 16550A UART (src/uart.v). White-box state exposed by PRE so the properties see the FIFO counters, the
# per-entry error flags and the interrupt terms; every transition property relates one non-reset step to the
# previous one (state and inputs copied in *_q). The FIFO pointer/count/error-count invariants are inductive.
FILES[uart]="uart.v"; MODE[uart]=induct; IDEPTH[uart]=1
PRE[uart]="hierarchy -top uart; proc; expose w:rx_n w:err_n w:tx_n w:tx_idle w:iid w:fen w:rtrig w:mcr w:erbfi w:etbei w:elsi w:oe w:cti_cnt w:rx_err w:rx_rp w:rx_wp w:tx_rp w:tx_wp w:dlab w:rx_push w:rx_end w:rx_full w:rd_rbr w:fcr_clr_rx w:fcr_clr_tx w:tick w:h_err w:err_ack"
PASSES[uart]="memory_map;"
NVDEPTH[uart]=12
# A broken copy and the covers run from a free state (-DFREE: armed from time 0, the state invariants assumed instead
# of asserted): the FIFOs cannot be filled from reset inside a BMC depth (a frame is 160 clocks at the fastest divisor).
DEFS[uart]="${NONVAC_RUN:+-DFREE}"
ALL+=(uart)
FILES[uart_cov]="uart.v"; MODE[uart_cov]=cover; PROPN[uart_cov]=uart; BDEPTH[uart_cov]=${UARTCOV_DEPTH:-40}
PASSES[uart_cov]="memory_map;"
PRE[uart_cov]="${PRE[uart]}"; DEFS[uart_cov]="-DFREE"
ALL+=(uart_cov)
