# WO-68: the PSRAM line burst changes nothing with its qualifier low: src/qspi_ctrl.v (burst tied 0) against the engine as it was
# before (tb/formal/qspi_ctrl_pre_burst.v), every pin and handshake output equal on every clock, free inputs, ddr free. Real engine
# through clk2fflogic (sby `multiclock on`), like qspi_pins. setundef -zero -init: both copies start from the same state.
FILES[qspi_burst_eq]="qspi_ctrl.v"; GEN[qspi_burst_eq]="$HERE/qspi_burst_eq_gen.sh"; MODE[qspi_burst_eq]=pdr; PDR_TIMEOUT[qspi_burst_eq]=3000
PASSES[qspi_burst_eq]="techmap t:\$shiftx; setundef -zero -init;"; SBYOPT[qspi_burst_eq]="multiclock on"
ALL+=(qspi_burst_eq)
PASSES[qspi_burst_eq_cov]="techmap t:\$shiftx; setundef -zero -init;"; FILES[qspi_burst_eq_cov]="qspi_ctrl.v"; GEN[qspi_burst_eq_cov]="$HERE/qspi_burst_eq_gen.sh"; MODE[qspi_burst_eq_cov]=cover; PROPN[qspi_burst_eq_cov]=qspi_burst_eq; BDEPTH[qspi_burst_eq_cov]=${BEQCOV_DEPTH:-360}; PDR_TIMEOUT[qspi_burst_eq_cov]=3000; SBYOPT[qspi_burst_eq_cov]=$'multiclock on\nvcd off'
ALL+=(qspi_burst_eq_cov)
