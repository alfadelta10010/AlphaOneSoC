# WO-54b: the QSPI engine has four negedge flops now (nib_n, cap_n: DDR launch and capture), and yosys
# formalff stops on a clk used with both polarities. Option A (clk2fflogic, two steps per clock, ddr free)
# measured 15x (mem_flash 5 s -> 75 s) and 19x (mem_arb 3 s -> 57 s) over the old harnesses, so these
# harnesses take option B: the SDR property list runs on a GENERATED copy of src/qspi_ctrl.v
# (qspi_ctrl_sdr.v, module name unchanged, no RTL edit) with `always @(negedge clk)` -> posedge, and
# mem_props.sv ties ddr = 0 and ddr_cap = 0. This is sound only because, with ddr = 0, no negedge flop
# reaches an output or a state bit:
#   * nib_n and cap_n are read in exactly three places: io_out = t_ddr ? nib_n : io_sdr, and the sr
#     update `else if (ddr_sh)` (ddr_sh = t_ddr && ...); nothing else reads them.
#   * t_ddr is reset to 0 and loaded only as `ddr && ...` (S_IDLE, S_GO), so with ddr = 0 it stays 0;
#     asserts are armed-gated (a reset has been applied), and the reset clears t_ddr and dq.
#   * every other DDR term is gated by t_ddr: launch, dq (cleared, then shifts in launch = 0), dq_hit,
#     dq_pend, ddr_sh, take_cont, and mode_chg = (t_ddr != ddr) || (t_ddr && ...) = 0.
#   * so with t_ddr = 0 the posedge/negedge difference of nib_n and cap_n is unobservable.
# gen_qspi_sdr refuses (ERROR) if qspi_ctrl.v has not exactly one `always @(negedge clk)` block holding
# exactly `nib_n <= nib_p;` and `cap_n <= io_in;`, so a new negedge flop re-opens this argument.
# The DDR side is checked by qspi_pins (clk2fflogic, ddr free), and DDR latency by the soc benches.
gen_qspi_sdr() {
  local f="$1/qspi_ctrl.v" o="$2/qspi_ctrl_sdr.v" blk
  [ "$(grep -c 'always @(negedge clk)' "$f")" = 1 ] || { echo "gen_qspi_sdr: not exactly one negedge block" >&2; return 1; }
  blk=$(awk '/always @\(negedge clk\)/{f=1;next} f&&/^ *end/{exit} f' "$f" | tr -s ' \n' ' ')
  [ "$blk" = " nib_n <= nib_p; cap_n <= io_in; " ] || { echo "gen_qspi_sdr: unexpected negedge block: $blk" >&2; return 1; }
  sed 's/always @(negedge clk)/always @(posedge clk)/' "$f" > "$o"
  [ "$(grep -v '^ *//' "$o" | grep -c negedge)" = 0 ] || return 1
  echo "$o"
}
PASSES[mem_flash]="techmap t:\$shiftx; setundef -anyseq;"; FILES[mem_flash]="mem_ctrl.v"; GEN[mem_flash]=gen_qspi_sdr; MODE[mem_flash]=pdr; PROPN[mem_flash]=mem; DEFS[mem_flash]="-DP_FLASH"; PDR_TIMEOUT[mem_flash]=1200
ALL+=(mem_flash)
