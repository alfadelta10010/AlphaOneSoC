# Antecedent covers (WO-30 D5): for each harness below, <n>_cov runs the `ifdef SBY_COVER
# cover() points of <n>_props.sv under sby. An unreached antecedent makes the implication
# assert it guards vacuous. Same sources, white-box recipe and passes as <n>.
for _n in csr core_hold core_fetch syscon_gate spi_dc spi_core spi_bus; do
  _c=${_n}_cov
  FILES[$_c]="${FILES[$_n]}"; MODE[$_c]=cover; PROPN[$_c]=$_n; BDEPTH[$_c]=${COV_DEPTH:-24}
  [ -n "${EXTRA[$_n]:-}" ] && EXTRA[$_c]="${EXTRA[$_n]}"
  [ -n "${PASSES[$_n]:-}" ] && PASSES[$_c]="${PASSES[$_n]}"
  [ -n "${PRE[$_n]:-}" ] && PRE[$_c]="${PRE[$_n]}"
  ALL+=("$_c")
done
