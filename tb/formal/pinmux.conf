# WO-56: output pinmux (src/pinmux.v). The two stored selects are exposed by PRE so the transition properties see
# the previous-cycle state; every property relates one non-reset step.
FILES[pinmux]="pinmux.v"; MODE[pinmux]=induct; IDEPTH[pinmux]=1
PRE[pinmux]="hierarchy -top pinmux; proc; expose w:alt5 w:alt6"
NVDEPTH[pinmux]=8
ALL+=(pinmux)
FILES[pinmux_cov]="pinmux.v"; MODE[pinmux_cov]=cover; PROPN[pinmux_cov]=pinmux; BDEPTH[pinmux_cov]=${PMCOV_DEPTH:-12}
PRE[pinmux_cov]="${PRE[pinmux]}"
ALL+=(pinmux_cov)
